[project]
name = "mewhelp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.139.0", "pydantic-settings>=2.14.2", "uvicorn[standard]>=0.51.0", "langchain>=1.3.13", "langchain-openai>=1.3.5", "openai>=2.45.0"]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
