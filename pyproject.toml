[project]
name = "mewhelp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.139.0", "pydantic-settings>=2.14.2", "uvicorn[standard]>=0.51.0", "langchain>=1.3.13", "langchain-openai>=1.3.5", "openai>=2.45.0", "sqlalchemy[asyncio]>=2.0.0", "asyncmy>=0.2.9", "aiosqlite>=0.20", "jsonschema>=4.26.0", "langchain-text-splitters>=1.1.2", "pymilvus[milvus-lite]>=3.0.0", "langgraph>=0.2", "langgraph-checkpoint-sqlite>=2.0", "mcp>=1.28.1", "langchain-mcp-adapters>=0.3.0", "langfuse>=4.14.0"]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
